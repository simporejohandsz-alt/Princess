  <style>
    :root {
      --red-main: #A90019;
      --red-deep: #780016;
      --red-bright: #D51E35;
      --paper: #FFF8F2;

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--red-main);
      color: var(--paper);
      font-family: 'Lora', Georgia, serif;
      overflow-x: hidden;
    }

    /* Fond rouge profond texturé façon papier velours scrapbook */
    .scrapbook-bg {
      background:
        radial-gradient(circle at 20% 18%, rgba(213, 30, 53, 0.45) 0%, transparent 48%),
        radial-gradient(circle at 82% 78%, rgba(120, 0, 22, 0.72) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, #A90019 0%, #780016 100%);
      position: relative;
    }

    /* Grain papier subtil par-dessus le fond */
    .paper-grain::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Texture feuille de papier blanc cassé */
    .letter-paper {
      background-color: #FFF8F2;
      background-image:
        linear-gradient(to bottom, rgba(217, 179, 108, 0.06) 1px, transparent 1px),
        radial-gradient(circle at top right, rgba(242, 198, 209, 0.25), transparent 60%);
      background-size: 100% 30px, 100% 100%;
      box-shadow:
        0 20px 50px rgba(33, 19, 23, 0.45),
        0 2px 10px rgba(33, 19, 23, 0.2),
        inset 0 0 35px rgba(217, 179, 108, 0.14);
      color: #211317;
    }

    /* Ruban adhésif décoratif (Washi Tape) */
    .washi-tape {
      background: linear-gradient(135deg, rgba(242, 198, 209, 0.78), rgba(255, 228, 235, 0.62));
      box-shadow: 0 1px 4px rgba(33, 19, 23, 0.18);
      backdrop-filter: blur(2px);
      border-left: 1px dashed rgba(255, 255, 255, 0.55);
      border-right: 1px dashed rgba(255, 255, 255, 0.55);
    }

    .washi-tape-gold {
      background: linear-gradient(135deg, rgba(217, 179, 108, 0.72), rgba(243, 220, 159, 0.62));
      box-shadow: 0 1px 4px rgba(33, 19, 23, 0.18);
      border-left: 1px dashed rgba(255, 255, 255, 0.5);
      border-right: 1px dashed rgba(255, 255, 255, 0.5);
    }

    /* Battement d'ailes naturel des papillons */
    @keyframes wingFlapLeft {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50% { transform: scaleX(0.32) rotate(-8deg); }
    }
    @keyframes wingFlapRight {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50% { transform: scaleX(0.32) rotate(8deg); }
    }
    .wing-left {
      transform-origin: 50px 50px;
      animation: wingFlapLeft var(--flap-speed, 0.55s) ease-in-out infinite;
    }
    .wing-right {
      transform-origin: 50px 50px;
      animation: wingFlapRight var(--flap-speed, 0.55s) ease-in-out infinite;
    }

    /* Vol flottant des papillons */
    @keyframes butterflyDrift1 {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      25% { transform: translate(18px, -22px) rotate(6deg); }
      50% { transform: translate(-12px, -38px) rotate(-10deg); }
      75% { transform: translate(-24px, -14px) rotate(4deg); }
    }
    @keyframes butterflyDrift2 {
      0%, 100% { transform: translate(0, 0) rotate(10deg); }
      33% { transform: translate(-22px, -26px) rotate(-6deg); }
      66% { transform: translate(16px, -18px) rotate(12deg); }
    }
    @keyframes butterflyDrift3 {
      0%, 100% { transform: translate(0, 0) rotate(-4deg); }
      50% { transform: translate(14px, -28px) rotate(9deg); }
    }

    .fly-1 { animation: butterflyDrift1 var(--drift-speed, 9s) ease-in-out infinite; }
    .fly-2 { animation: butterflyDrift2 var(--drift-speed, 11s) ease-in-out infinite; }
    .fly-3 { animation: butterflyDrift3 var(--drift-speed, 8s) ease-in-out infinite; }

    /* Rotation du disque vinyle */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-spinning {
      animation: spinVinyl 6s linear infinite;
    }
    .vinyl-paused {
      animation: spinVinyl 6s linear infinite;
      animation-play-state: paused;
    }

    /* Chute douce des pétales et confettis */
    @keyframes petalFall {
      0% {
        transform: translateY(-10vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.95; }
      85% { opacity: 0.9; }
      100% {
        transform: translateY(105vh) translateX(45px) rotate(360deg);
        opacity: 0;
      }
    }
    .petal-fall {
      animation: petalFall var(--fall-duration, 7s) linear infinite;
      animation-delay: var(--fall-delay, 0s);
    }

    /* Scintillement doux des étoiles & bougies */
    @keyframes gentleTwinkle {
      0%, 100% { opacity: 0.45; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    .twinkle {
      animation: gentleTwinkle 3.2s ease-in-out infinite;
    }

    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); }
      35% { transform: scale(1.08, 0.94) rotate(2deg); }
      70% { transform: scale(0.95, 1.06) rotate(-1deg); }
    }
    .candle-flame {
      transform-origin: bottom center;
      animation: flameFlicker 0.8s ease-in-out infinite;
    }

    /* Notes musicales flottantes */
    @keyframes floatNote {
      0% { transform: translateY(0) scale(0.8) rotate(-8deg); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-75px) translateX(18px) scale(1.15) rotate(12deg); opacity: 0; }
    }
    .music-note {
      animation: floatNote 3.2s ease-out infinite;
    }

    /* Transitions de scène */
    @keyframes sceneFadeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .scene-enter {
      animation: sceneFadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Objet physique interactif */
    .scrapbook-object {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
      cursor: pointer;
    }
    .scrapbook-object:hover {
      transform: translateY(-8px) scale(1.04) rotate(0deg) !important;
      filter: drop-shadow(0 18px 25px rgba(33, 19, 23, 0.45));
    }
    .scrapbook-object:active {
      transform: scale(0.97) !important;
    }

    /* Barre de défilement élégante pour la lettre */
    .letter-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .letter-scroll::-webkit-scrollbar-track {
      background: rgba(217, 179, 108, 0.12);
      border-radius: 999px;
    }
    .letter-scroll::-webkit-scrollbar-thumb {
      background: rgba(169, 0, 25, 0.35);
      border-radius: 999px;
    }
  </style>

    /* =========================================================================
       SCÈNE 3 : LA LETTRE PRINCIPALE EN 6 CHAPITRES PROGRESSIFS
       ========================================================================= */
    function LoveLetter({ onBack, onComplete }) {
      const [chapterIndex, setChapterIndex] = useState(0);
      const [revealedWishes, setRevealedWishes] = useState(1);
      const scrollRef = useRef(null);

      const chapter = LETTER_CHAPTERS[chapterIndex];
      const isLastChapter = chapterIndex === LETTER_CHAPTERS.length - 1;

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = 0;
        }
        if (isLastChapter && onComplete) {
          onComplete();
        }
      }, [chapterIndex]);

      const handleNext = () => {
        if (chapterIndex < LETTER_CHAPTERS.length - 1) {
          setChapterIndex((prev) => prev + 1);
        }
      };

      const handlePrev = () => {
        if (chapterIndex > 0) {
          setChapterIndex((prev) => prev - 1);
        }
      };

      return (
        <div className="relative z-20 min-h-screen flex flex-col items-center justify-between px-3 sm:px-6 py-6 sm:py-8 max-w-4xl mx-auto scene-enter">

            >

            </button>

            <div className="flex items-center gap-1.5 sm:gap-2">

                  onClick={() => setChapterIndex(idx)}
                  aria-label={`Aller au ${ch.step}`}
                  className={`h-2.5 rounded-full transition-all cursor-pointer ${
                    idx === chapterIndex
                      ? 'w-8 bg-[#FFF8F2]'
                      : idx < chapterIndex
                      ? 'w-2.5 bg-[#D9B36C]'
                      : 'w-2.5 bg-[#FFF8F2]/35 hover:bg-[#FFF8F2]/60'

    /* =========================================================================
       SCÈNE 6 : LECTEUR DISQUE VINYLE — « THIS SONG REMINDS ME OF YOU »
       ========================================================================= */
    function VinylPlayer({ onBack }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [volume, setVolume] = useState(0.75);
      const [audioSrc, setAudioSrc] = useState('./musique.mp3');
      const [trackName, setTrackName] = useState('Perfect — Ed Sheeran (Version souvenir)');

      const audioRef = useRef(null);
      const fileInputRef = useRef(null);
      const synthTimerRef = useRef(null);
      const audioCtxRef = useRef(null);

      // Nettoyage audio à la sortie de la scène
      useEffect(() => {
        return () => {
          stopSynthMelody();
          if (audioRef.current) {
            audioRef.current.pause();
          }
        };
      }, []);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
        }
      }, [volume]);

      // Mélodie douce romantique en Web Audio API si aucun fichier MP3 n'est encore importé
      const startSynthMelody = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          audioCtxRef.current = ctx;

          // Arpège doux évoquant une boîte à musique romantique (en Sol majeur)
          const notes = [392.0, 493.88, 587.33, 493.88, 329.63, 493.88, 587.33, 493.88, 261.63, 392.0, 493.88, 392.0, 293.66, 369.99, 440.0, 369.99];
          let step = 0;

          const playStep = () => {
            if (!audioCtxRef.current) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[step % notes.length], now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(0.12 * volume, now + 0.06);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.95);
            step += 1;
          };

          playStep();
          synthTimerRef.current = setInterval(playStep, 620);
        } catch (err) {
          // Fallback silencieux si bloqué
        }
      };

      const stopSynthMelody = () => {
        if (synthTimerRef.current) {
          clearInterval(synthTimerRef.current);
          synthTimerRef.current = null;
        }
        if (audioCtxRef.current) {
          audioCtxRef.current.close().catch(() => {});
          audioCtxRef.current = null;
        }
      };

      const togglePlay = () => {
        if (isPlaying) {
          if (audioSrc && audioRef.current) {
            audioRef.current.pause();
          } else {
            stopSynthMelody();
          }
          setIsPlaying(false);
        } else {
          if (audioSrc && audioRef.current) {
            audioRef.current.play().catch(() => {});
          } else {
            startSynthMelody();
          }
          setIsPlaying(true);
        }
      };

      const handleAudioUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        stopSynthMelody();
        const url = URL.createObjectURL(file);
        setAudioSrc(url);
        setTrackName(file.name.replace(/\.[^/.]+$/, ''));
        setIsPlaying(false);
      };

      return (
        <div className="relative z-20 min-h-screen flex flex-col items-center justify-between px-4 py-6 sm:py-8 max-w-4xl mx-auto scene-enter">
          {audioSrc && (
            <audio
              ref={audioRef}
              src={audioSrc}
              onEnded={() => setIsPlaying(false)}
            />
          )}
          <input
            ref={fileInputRef}
            type="file"
            accept="audio/*"
            onChange={handleAudioUpload}
            className="hidden"
          />

          {/* Retour */}
          <div className="w-full flex flex-wrap items-center justify-between gap-2">
            <button
              onClick={onBack}
              className="px-4 py-2 rounded-full bg-[#780016]/80 hover:bg-[#780016] text-[#FFF8F2] border border-[#D9B36C]/40 text-sm transition-all cursor-pointer"
            >
              ← Retour à l’album
            </button>

            <button
              onClick={() => fileInputRef.current?.click()}
              className="px-3.5 py-1.5 rounded-full bg-[#FFF8F2]/15 hover:bg-[#FFF8F2]/25 text-[#FFF8F2] border border-[#FFF8F2]/30 text-xs transition-colors cursor-pointer"
            >
              🎵 Importer mon fichier audio (.mp3)
            </button>
          </div>

          {/* Titre */}
          <div className="text-center my-2">
            <h2 className="font-script text-4xl sm:text-6xl text-[#FFF8F2]">
              This song reminds me of you
            </h2>
            <p className="font-editorial italic text-lg sm:text-xl text-[#F2C6D1] mt-1">
              « Now I know I have met an angel in person » — Ed Sheeran, Perfect
            </p>
          </div>

          {/* Grand Disque Vinyle Noir & Rouge */}
          <div className="relative my-4 flex flex-col items-center">
            {/* Notes musicales flottantes pendant la lecture */}
            {isPlaying && (
              <div className="absolute -top-6 inset-x-0 flex justify-around pointer-events-none z-30">
                <span className="music-note text-2xl text-[#D9B36C]">♪</span>
                <span className="music-note text-3xl text-[#F2C6D1]" style={{ animationDelay: '0.9s' }}>♫</span>
                <span className="music-note text-2xl text-[#FFF8F2]" style={{ animationDelay: '1.7s' }}>♪</span>
              </div>
            )}

            <div className="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center">
              {/* Disque vinyle */}
              <div
                onClick={togglePlay}
                className={`w-full h-full rounded-full bg-[#211317] shadow-[0_25px_55px_rgba(0,0,0,0.65)] border-4 border-[#150c0f] flex items-center justify-center cursor-pointer relative ${
                  isPlaying ? 'vinyl-spinning' : 'vinyl-paused'
                }`}
              >
                {/* Sillons du vinyle */}
                <div className="absolute inset-4 rounded-full border border-white/10" />
                <div className="absolute inset-8 rounded-full border border-white/10" />
                <div className="absolute inset-12 rounded-full border border-white/10" />
                <div className="absolute inset-16 rounded-full border border-white/10" />

                {/* Reflet lumineux subtil */}
                <div
                  className="absolute inset-0 rounded-full pointer-events-none"
                  style={{
                    background: 'conic-gradient(from 45deg, transparent 0%, rgba(255,255,255,0.08) 12%, transparent 25%, transparent 50%, rgba(255,255,255,0.08) 62%, transparent 75%)',
                  }}
                />

                {/* Macaron central rouge & doré */}
                <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-br from-[#D51E35] to-[#780016] border-4 border-[#D9B36C] flex flex-col items-center justify-center text-center p-2 shadow-inner">
                  <span className="font-script text-xl sm:text-2xl text-[#FFF8F2] leading-none">Perfect</span>
                  <span className="text-[9px] uppercase tracking-widest text-[#F2C6D1] mt-0.5">Ma Princesse</span>
                  <div className="w-3.5 h-3.5 rounded-full bg-[#FFF8F2] mt-1.5 border border-[#211317]" />
                </div>
              </div>
            </div>

            {/* Contrôles du lecteur */}
            <div className="mt-6 w-full max-w-sm bg-[#780016]/80 backdrop-blur-md border border-[#D9B36C]/45 rounded-2xl p-4 flex flex-col items-center gap-3 shadow-xl">
              <p className="font-editorial text-base text-[#FFF8F2] truncate max-w-full">
                {trackName}
              </p>

              <div className="flex items-center gap-5">
                <button
                  onClick={togglePlay}
                  className="px-6 py-2.5 rounded-full bg-[#FFF8F2] hover:bg-[#FFE4EB] text-[#780016] font-editorial font-bold text-lg shadow-md transition-transform active:scale-95 cursor-pointer"
                >
                  {isPlaying ? '⏸ Pause' : '▶ Écouter'}
                </button>

                {/* Contrôle du volume */}
                <div className="flex items-center gap-2">
                  <span className="text-sm">🔊</span>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={volume}
                    onChange={(e) => setVolume(parseFloat(e.target.value))}
                    aria-label="Volume"
                    className="w-24 accent-[#D9B36C] cursor-pointer"
                  />
                </div>
              </div>
            </div>
          </div>

          <div className="h-4" />
        </div>
      );
    }

    /* =========================================================================
       SCÈNE 8 : LA SURPRISE FINALE — LE PAPILLON BLANC & L'ENVELOPPE ULTIME
       ========================================================================= */
    function FinalSurprise({ onRestart }) {
      const [envelopeOpened, setEnvelopeOpened] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => {
          setEnvelopeOpened(true);
        }, 1400);
        return () => clearTimeout(timer);
      }, []);

      const celebrationPetals = useMemo(
        () =>
          Array.from({ length: 24 }).map((_, i) => ({
            id: i,
            left: `${(i * 4.2) % 98}%`,
            duration: `${6 + (i % 5)}s`,
            delay: `${(i * 0.3) % 4}s`,
            type: i % 3,
          })),
        []
      );

      return (
        <div className="relative z-20 min-h-screen flex flex-col items-center justify-center px-4 py-10 text-center scene-enter overflow-hidden">
          {/* Pluie poétique de pétales et cœurs */}
          {envelopeOpened && (
            <div className="fixed inset-0 pointer-events-none z-10">
              {celebrationPetals.map((item) => (
                <div
                  key={item.id}
                  className="petal-fall absolute -top-8"
                  style={{
                    left: item.left,
                    '--fall-duration': item.duration,
                    '--fall-delay': item.delay,
                  }}
                >
                  {item.type === 0 ? (
                    <span className="text-[#F2C6D1] text-lg">♥</span>
                  ) : item.type === 1 ? (
                    <span className="text-[#D9B36C] text-base">✦</span>
                  ) : (
                    <svg width="16" height="22" viewBox="0 0 18 24">
                      <path d="M9 0 C16 8, 16 18, 9 24 C2 18, 2 8, 9 0 Z" fill="#FFE4EB" opacity="0.85" />
                    </svg>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Papillon blanc lumineux qui se pose vers l'enveloppe */}
          <div
            className={`transition-all duration-1000 mb-4 ${
              envelopeOpened ? 'translate-y-2 scale-100' : '-translate-y-12 scale-125'
            }`}
          >
            <ButterflySVG variant="white" size={68} slow />
          </div>

          {/* Grande enveloppe dorée & rouge qui s'ouvre */}
          <div
            onClick={() => setEnvelopeOpened(true)}
            className="relative w-full max-w-lg rounded-2xl letter-paper p-7 sm:p-10 border-2 border-[#D9B36C] shadow-[0_30px_70px_rgba(33,19,23,0.65)] transition-all duration-700 cursor-pointer"
          >
            {/* Sceau doré ouvert */}
            <div className="w-14 h-14 mx-auto -mt-12 mb-4 rounded-full bg-gradient-to-br from-[#F3DC9F] to-[#D9B36C] border-2 border-[#FFF8F2] shadow-lg flex items-center justify-center text-[#780016]">
              <svg className="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </div>

            <div className="space-y-4 font-body text-base sm:text-lg text-[#211317] leading-relaxed">
              <p className="font-script text-4xl sm:text-5xl text-[#A90019]">
                À ma princesse,
              </p>
              <p>
                Je voulais simplement que ton anniversaire soit aussi spécial que la place que tu occupes dans mon cœur.
              </p>
              <p className="font-semibold text-xl text-[#780016]">
                Je t’aime mvvv. ❤️
              </p>
            </div>

            <div className="mt-6 pt-5 border-t border-[#D9B36C]/45">
              <h2 className="font-editorial font-bold text-2xl sm:text-4xl tracking-[0.14em] text-[#A90019] uppercase">
                JOYEUX ANNIVERSAIRE !
              </h2>
            </div>
          </div>

          {/* Bouton Recommencer notre petite histoire */}
          <button
            onClick={onRestart}
            className="mt-8 px-7 py-3 rounded-full bg-[#780016]/85 hover:bg-[#780016] text-[#FFF8F2] border border-[#D9B36C]/60 font-editorial text-lg tracking-wide shadow-lg transition-all transform hover:scale-105 cursor-pointer"
          >
            Recommencer notre petite histoire ♡
          </button>
        </div>
      );
    }

    /* =========================================================================
       COMPOSANT RACINE : APPLICATION COMPLÈTE
       ========================================================================= */
    function App() {
      const [currentScene, setCurrentScene] = useState('welcome'); // 'welcome' | 'album' | 'letter' | 'bouquet' | 'cake' | 'vinyl' | 'final'
      const [visited, setVisited] = useState({
        letter: false,
        bouquet: false,
        cake: false,
        vinyl: false,
      });

      const handleSelectScene = (scene) => {
        setCurrentScene(scene);
        if (scene in visited) {
          setVisited((prev) => ({ ...prev, [scene]: true }));
        }
      };

      const handleRestart = () => {
        setCurrentScene('welcome');
      };

      return (
        <div className="relative min-h-screen w-full overflow-x-hidden">
          {/* Papillons et décors poétiques permanents (ralentis lors de la surprise finale) */}
          <AmbientScrapbookDecor slow={currentScene === 'final'} />

          {currentScene === 'welcome' && (
            <WelcomeScreen onEnterAlbum={() => setCurrentScene('album')} />
          )}

          {currentScene === 'album' && (
            <MainAlbum onSelectScene={handleSelectScene} visited={visited} />
          )}

          {currentScene === 'letter' && (
            <LoveLetter
              onBack={() => setCurrentScene('album')}
              onComplete={() => setVisited((prev) => ({ ...prev, letter: true }))}
            />
          )}

          {currentScene === 'bouquet' && (
            <FlowerBouquet onBack={() => setCurrentScene('album')} />
          )}

          {currentScene === 'cake' && (
            <BirthdayCakeScene onBack={() => setCurrentScene('album')} />
          )}

          {currentScene === 'vinyl' && (
            <VinylPlayer onBack={() => setCurrentScene('album')} />
          )}

          {currentScene === 'final' && (
            <FinalSurprise onRestart={handleRestart} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
